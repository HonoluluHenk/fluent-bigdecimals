include:
  - template: Auto-DevOps.gitlab-ci.yml

build:
  stage: build
  image: maven:3.9.15-eclipse-temurin-${JDK_VERSION}
  parallel:
    matrix:
      - JDK_VERSION: "11"
        ARTIFACT_PATH: ".no-artifacts"
      - JDK_VERSION: "17"
        ARTIFACT_PATH: ".no-artifacts"
      - JDK_VERSION: "21"
        ARTIFACT_PATH: ".no-artifacts"
      - JDK_VERSION: "25"
        ARTIFACT_PATH: ".no-artifacts"
  script: |
    # signkey is only given for the main branch; only Java 8 publishes artifacts
    if [ "${JDK_VERSION}" = "11" ] && [ -n "${OSSRH_SIGNKEY_KEY}" ]; then
      apt update
      apt install -y gnupg
      cat "${OSSRH_SIGNKEY_KEY}" | base64 -d | gpg --batch --passphrase "${OSSRH_SIGNKEY_PASSPHRASE}" --import
      ./mvnw --settings settings.xml clean deploy
    else
      ./mvnw --settings settings.xml clean verify
    fi
    ./mvnw gemnasium:dump-dependencies
  interruptible: true
  artifacts:
    expire_in: 30 min
    paths:
      - ${ARTIFACT_PATH}

spotbugs-sast:
  variables:
    SAST_JAVA_VERSION: "11"

test:
  interruptible: true
  # build runs in container but artifacts are expected outside ($CI_PROJECT_DIR is mapped)
  after_script:
    - 'cp -r -- /app/target "$CI_PROJECT_DIR"'
  artifacts:
    when: always
    paths:
      - target/site/jacoco/jacoco.xml
    reports:
      junit:
        - 'target/surefire-reports/TEST-*.xml'
        - 'target/failsafe-reports/TEST-*.xml'

record_coverage:
  stage: deploy
  needs:
    - test
  dependencies:
    - test
  image: haynes/jacoco2cobertura:1.0.4
  script:
    # convert report from jacoco to cobertura
    - 'python /opt/cover2cover.py target/site/jacoco/jacoco.xml src/main/java > target/site/cobertura.xml'
    # gitlab does not understand the cobertura <source> tag and neads each filename to be relative to repo-root.
    # => read the <source></source> tag and prepend the path to every filename attribute
    - 'python /opt/source2filename.py target/site/cobertura.xml'
  artifacts:
    reports:
      cobertura: target/site/cobertura.xml

container_scanning:
  stage: test
  when: manual
  script:
    - echo "disabled"

dast:
  when: manual
